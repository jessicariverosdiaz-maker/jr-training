<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JR.TRAINING</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="JR.TRAINING">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000000; --panel:#141414; --panel2:#1E1E1E; --line:#2E2E2E;
  --txt:#F4F1EC; --mute:#9B9690;
  --acc:#FF7A1A; --acc-soft:#2B1708; --ice:#6FB7D6; --hot:#E5383B; --gold:#FFD166;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px}
h1,h2,h3,h4{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;margin:0;letter-spacing:.3px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ice);outline-offset:2px}

.app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:8px}
.top h1{font-size:36px;font-weight:700;letter-spacing:1px}
.top h1 i{font-style:normal;color:var(--acc)}
.top span{color:var(--mute);font-size:14px;text-align:right}

/* meses */
.meses{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.meses::-webkit-scrollbar{display:none}
.mes{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:600;color:var(--mute)}
.mes.on{background:var(--acc);border-color:var(--acc);color:#000}

/* calendario 4 x 7 */
.plan{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-top:6px}
.grid{display:grid;grid-template-columns:34px repeat(7,1fr);gap:6px;align-items:center;text-align:center}
.grid b{font-size:13px;color:var(--mute);font-weight:600}
.grid .sem{color:var(--txt);font-family:'Barlow Condensed',sans-serif;font-size:18px;text-align:left}
.grid button{height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);font-size:18px;line-height:1;color:var(--acc)}
.grid button.dato{border-color:var(--acc)}
.grid button.done{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}
.grid button.sel{box-shadow:0 0 0 3px var(--ice)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px 0;font-size:13px;color:var(--mute)}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--acc);background:var(--panel2);vertical-align:-1px;margin-right:5px}
.leyenda i.h{background:var(--acc)}

/* dia */
.dia{margin:22px 0 10px}
.dia h2{font-size:30px;font-weight:700}
.dia p{margin:2px 0 0;color:var(--mute);font-size:14px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:24px}
.card.aero{border-left:6px solid var(--acc)}
.cab{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.sr{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:15px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=date]{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel2);width:100%}
.sr input{width:58px;text-align:center;font-weight:600;color:var(--txt)}
.ej{padding:10px 0;border-top:1px solid var(--line)}
.ej .nom{font-weight:600;font-size:17px;background:transparent;border-color:transparent;padding-left:0}
.ej .nom:focus{background:var(--panel2);border-color:var(--line);padding-left:10px}
.fila{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--mute);font-size:15px}
.fila label{display:flex;align-items:center;gap:6px}
.fila input.kg{width:76px;text-align:center;font-weight:600;border-color:var(--acc)}
.fila .bt{margin-left:auto;display:flex;gap:6px}
.vid{border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 14px;font-weight:600;color:var(--mute)}
.vid.si{border-color:var(--ice);color:var(--ice)}
.aer input{margin-top:8px}
.aer input:first-of-type{margin-top:0}

/* tabata */
.tb{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tb h4{margin:0 0 8px;font-size:20px;font-weight:600}
.tbcfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbcfg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.tbcfg input{text-align:center;font-weight:600;color:var(--txt)}
.tbvis{margin:14px 0 10px;text-align:center;border-radius:12px;padding:14px 8px;background:var(--panel2);border:1.5px solid var(--line)}
.tbvis.trabajo{border-color:var(--acc);background:var(--acc-soft)}
.tbvis.descanso{border-color:var(--ice)}
#tb-fase{font-weight:600;color:var(--mute)}
.trabajo #tb-fase{color:var(--acc)}.descanso #tb-fase{color:var(--ice)}
#tb-t{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:700;line-height:1}
#tb-r{color:var(--mute);font-size:14px}
.tbbtn{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.tbbtn button{height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);font-weight:600}
.tbbtn button.go{background:var(--acc);border-color:var(--acc);color:#000}

/* fatiga (barra) */
.fat{width:100%;margin:14px 0 4px;height:16px;border-radius:999px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,var(--gold),var(--acc),var(--hot));outline-offset:6px}
.fat::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:4px solid var(--bg);box-shadow:0 0 0 2px var(--txt)}
.fat::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid var(--bg)}
.fat.vacio0{opacity:.55}
.fat-esc{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.fat-txt{margin:8px 0 0;font-weight:600;min-height:1.4em}

/* otras pestañas */
.vacio{background:var(--panel);border:1.5px dashed var(--line);border-radius:14px;padding:18px;margin-top:12px}
.vacio h2{font-size:28px;margin-bottom:6px}
.vacio p{margin:0 0 10px;color:var(--mute)}
.burb{max-width:80%;padding:10px 12px;border-radius:14px;margin:8px 0}
.burb.a{background:var(--panel2);border-bottom-left-radius:4px}
.burb.p{background:var(--acc);color:#000;margin-left:auto;border-bottom-right-radius:4px}
.pago{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.pago em{font-style:normal;font-weight:600;color:var(--ice)}
.pago em.pend{color:var(--gold)}

/* ventanas (ficha y biblioteca) */
dialog{background:var(--panel);color:var(--txt);border:1.5px solid var(--line);border-radius:14px;padding:18px;width:min(94vw,460px);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog h3{font-size:26px;margin-bottom:8px}
dialog h4{font-size:20px;margin:16px 0 6px}
dialog p{color:var(--mute);margin:8px 0}
dialog p.cred{font-size:12px}
dialog a.ver{display:block;text-align:center;background:var(--ice);color:#000;font-weight:600;border-radius:10px;padding:12px;text-decoration:none;margin:10px 0}
dialog video{width:100%;border-radius:10px;background:#000;margin-bottom:8px}
.gif{display:block;width:100%;max-width:240px;margin:8px auto;border-radius:10px;background:#fff}
.tags span{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:13px;color:var(--mute)}
ol.pasos{padding-left:20px;margin:10px 0}
ol.pasos li{margin-bottom:6px}
.btnf,.grande{display:block;width:100%;text-align:center;border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px;font-weight:600;margin:8px 0;cursor:pointer}
.btnf[hidden]{display:none}
.dbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.dbtn button{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);font-weight:600}
.dbtn button.go{background:var(--acc);border-color:var(--acc);color:#000}
#pick[open]{display:flex;flex-direction:column;max-height:90vh}
.pkf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pkf select{border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--panel2)}
#pk-list{overflow:auto;flex:1;min-height:180px;margin-top:4px}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px;margin-top:8px}
.pk img{width:56px;height:56px;border-radius:8px;background:#fff;flex:none}
.pk small{display:block;color:var(--mute);font-size:13px}
.pk.own{border-color:var(--acc)}
.pk.go{background:var(--acc);border-color:var(--acc);color:#000;justify-content:center}

.hecho{display:block;width:100%;height:54px;border-radius:12px;border:2px solid var(--acc);background:transparent;color:var(--acc);font-weight:700;font-size:18px;margin-bottom:12px}
.hecho.on{background:var(--acc);color:#000}

.quien{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14px;color:var(--mute)}
.quien b{color:var(--txt);font-size:15px}
.mini{border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--mute)}
.login{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-top:12px}
.login h2{font-size:28px;margin-bottom:6px}
.login p{color:var(--mute);margin:0 0 12px}
.login input{margin-bottom:10px}
.login p.okmsg{color:var(--ice);margin:0 0 8px}
.login .mini{margin-top:4px}
.login p.err{color:var(--hot);min-height:1.3em;margin:0 0 8px}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--panel2);border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:5}
#aviso.on{opacity:1}
input[readonly]{border-color:transparent}

.burb{white-space:pre-wrap;word-break:break-word}
.burb small{display:block;font-size:12px;opacity:.7;margin-bottom:2px}
#chat-list{max-height:52vh;overflow:auto;margin:8px 0}
#chat-list p{color:var(--mute);text-align:center}
.chatbox{display:flex;gap:8px;align-items:flex-end}
textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);width:100%;resize:none;font:inherit;color:var(--txt)}
.vid.go{background:var(--acc);border-color:var(--acc);color:#000;height:44px}
.bd{background:var(--acc);color:#000;border-radius:999px;font-size:12px;padding:1px 7px;margin-left:4px}

.pgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 4px;color:var(--mute)}
.pg b{color:var(--txt);font-family:'Barlow Condensed',sans-serif;font-size:20px}
.pg span{font-size:14px;font-weight:600}
.pg small{font-size:12px}
.pg.pago{border-color:var(--ice);color:var(--ice)}
.pg.pend{border-color:var(--gold);color:var(--gold)}
.pg:disabled{cursor:default}
.mini.big{font-size:18px;padding:2px 14px}

/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;padding:14px 4px;font-weight:600;color:var(--mute);border-top:4px solid transparent}
.tabs button.on{color:var(--txt);border-top-color:var(--acc)}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>JR<i>.</i>TRAINING</h1><div class="quien" id="quien"></div></div>
  <main id="vista"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Secciones"><div>
  <button data-t="rutinas">Rutinas</button>
  <button data-t="chat">Chat</button>
  <button data-t="perfil">Perfil y pagos</button>
</div></nav>
<datalist id="bib"></datalist>
<dialog id="dlg"></dialog>
<dialog id="pick"></dialog>
<dialog id="alus"></dialog>
<div id="aviso" role="status"></div>

<script>
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DIAS=['L','M','X','J','V','S','D'];
const DIAS_L=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];

/* Base de ejercicios en español (funciona sin internet) */
const LIB={
  'Piernas':['Sentadilla goblet','Sentadilla con barra','Sentadilla búlgara','Prensa de piernas','Estocadas caminando','Estocada reversa','Peso muerto rumano','Peso muerto convencional','Puente de glúteos','Hip thrust','Step-up','Curl femoral','Extensión de cuádriceps','Elevación de talones'],
  'Empuje':['Press de banca con barra','Press de banca con mancuernas','Press inclinado con mancuernas','Flexiones','Press militar','Press Arnold','Fondos en banco','Aperturas con mancuernas','Elevaciones laterales','Extensión de tríceps en polea'],
  'Tirón':['Remo con mancuerna','Remo con barra','Remo en polea baja','Jalón al pecho','Dominadas asistidas','Face pull','Pullover en polea','Curl de bíceps con barra','Curl martillo','Encogimientos de hombros'],
  'Core':['Plancha','Plancha lateral','Abdominales en polea','Dead bug','Bird dog','Elevación de piernas','Russian twist','Rueda abdominal','Mountain climbers','Pallof press'],
  'Funcional':['Burpees','Kettlebell swing','Salto al cajón','Saltos de tijera','Farmer walk','Sled push','Battle ropes','Wall ball','Remo en máquina','Soga']
};
const GRUPOS=Object.keys(LIB);
const SR=[[3,12],[3,10],[4,8],[3,15]];
const FAT_TXT=['Sin marcar','Muy liviano','Liviano','Liviano','Normal','Normal','Normal','Duro','Duro','Al límite','Al límite'];

/* Biblioteca completa (1.324 ejercicios) */
const RAW='https://raw.githubusercontent.com/hasaneyldrm/exercises-dataset/main/';
const BODY={'upper arms':'Brazos','upper legs':'Muslos','back':'Espalda','waist':'Abdomen','chest':'Pecho','shoulders':'Hombros','lower legs':'Pantorrillas','lower arms':'Antebrazos','cardio':'Cardio','neck':'Cuello'};
const EQ={'body weight':'Peso corporal','dumbbell':'Mancuerna','cable':'Polea','barbell':'Barra','leverage machine':'Máquina','band':'Banda','smith machine':'Smith','kettlebell':'Kettlebell','weighted':'Con peso','stability ball':'Pelota','ez barbell':'Barra Z','other':'Otro'};
/* Para poder buscar en español (los nombres del repositorio están en inglés) */
const DICT={sentadilla:['squat'],estocada:['lunge'],zancada:['lunge'],muerto:['deadlift'],press:['press'],banca:['bench'],inclinado:['incline'],declinado:['decline'],remo:['row'],jalon:['pulldown','pull-down'],dominada:['pull-up','chin-up'],flexion:['push-up'],fondo:['dip'],curl:['curl'],biceps:['biceps'],triceps:['triceps'],hombro:['shoulder','delt'],espalda:['back','lat'],pierna:['leg'],muslo:['thigh','leg'],cuadriceps:['quad'],isquio:['hamstring','leg curl'],gluteo:['glute','hip thrust','bridge'],pantorrilla:['calf'],gemelo:['calf'],antebrazo:['forearm','wrist'],cuello:['neck'],abdominal:['crunch','sit-up','abs'],plancha:['plank'],elevacion:['raise'],lateral:['lateral','side'],frontal:['front'],mancuerna:['dumbbell'],barra:['barbell'],polea:['cable'],maquina:['lever','machine'],banda:['band'],liga:['band'],pelota:['stability ball','ball'],cuerda:['rope'],salto:['jump'],burpee:['burpee'],giro:['twist','rotation'],apertura:['fly'],pullover:['pullover'],encogimiento:['shrug'],hiperextension:['hyperextension','back extension'],puente:['bridge'],correr:['run'],trote:['run'],cinta:['treadmill'],bicicleta:['bike','cycle'],caminata:['walk'],bulgara:['split squat','bulgarian'],corporal:['body weight']};
const STOP=new Set(['de','con','en','el','la','los','las','y','a','al','del','peso']);
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

let DS=null,DSID=new Map(),DSNAME=new Map();
function indexDS(){
  DSID=new Map();DSNAME=new Map();
  DS.forEach(x=>{
    DSID.set(x.id,x);DSNAME.set(x.n.toLowerCase(),x);
    x.h=norm([x.n,store.alias[x.id]||'',x.t,x.q,x.b,BODY[x.b]||'',EQ[x.q]||''].join(' '));
  });
}
function coincide(x,q,b,e){
  if(b&&x.b!==b)return false;
  if(e&&x.q!==e)return false;
  const toks=norm(q).split(/\s+/).filter(t=>t&&!STOP.has(t));
  return toks.every(t=>{
    if(x.h.includes(t))return true;
    for(const k in DICT){if(k.length>=3&&t.startsWith(k)&&DICT[k].some(w=>x.h.includes(w)))return true}
    return false;
  });
}
const pasos=t=>(t.match(/[^.!?]+[.!?]*/g)||[t]).map(s=>s.trim()).filter(Boolean);
const slim=x=>{
  const es=x.instruction_steps&&x.instruction_steps.es&&x.instruction_steps.es.length?x.instruction_steps.es
    :pasos((x.instructions&&(x.instructions.es||x.instructions.en))||'');
  return {id:x.id,n:x.name,b:x.body_part||x.category,q:x.equipment,t:x.target,i:x.image,g:x.gif_url,p:Array.isArray(es)?es:pasos(String(es))};
};
/* Lee el JSON de a pedazos para no llenar la memoria del celular */
async function leerStream(resp,say){
  if(!resp.body||!resp.body.getReader){return (await resp.json()).map(slim)}
  const total=+resp.headers.get('content-length')||16600000;
  const rd=resp.body.getReader(),dec=new TextDecoder();
  const out=[];let buf='',pos=0,depth=0,ins=false,esc_=false,start=-1,got=0;
  for(;;){
    const r=await rd.read();if(r.done)break;
    got+=r.value.length;buf+=dec.decode(r.value,{stream:true});
    for(let i=pos;i<buf.length;i++){
      const c=buf[i];
      if(ins){if(esc_)esc_=false;else if(c==='\\')esc_=true;else if(c==='"')ins=false;continue}
      if(c==='"'){ins=true;continue}
      if(c==='{'){if(depth===0)start=i;depth++}
      else if(c==='}'){depth--;if(depth===0&&start>=0){out.push(slim(JSON.parse(buf.slice(start,i+1))));start=-1}}
    }
    if(start>=0){buf=buf.slice(start);pos=buf.length;start=0}else{buf='';pos=0}
    say('Descargando… '+Math.min(99,Math.round(got/total*100))+'%');
  }
  return out;
}
async function bajarDS(){
  const say=t=>{const m=document.getElementById('pk-msg');if(m)m.textContent=t};
  say('Descargando… 0%');
  const urls=[RAW+'data/exercises.json','https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@main/data/exercises.json'];
  let ultimo='';
  for(const u of urls){
    try{
      const r=await fetch(u);
      if(!r.ok)throw new Error('respuesta '+r.status);
      const lista=await leerStream(r,say);
      if(!lista.length)throw new Error('archivo vacío');
      DS=lista;
      try{localStorage.setItem('jr_ds',JSON.stringify(DS))}catch(e){}
      indexDS();fillPick();return;
    }catch(e){ultimo=(e&&e.message)||String(e)}
  }
  say('No se pudo descargar. Detalle: '+ultimo);
}

/* ---------- Datos guardados ---------- */
let store={v:{},f:{},ok:{},vid:{},lib:[],alias:{},own:{}};
try{const s=JSON.parse(localStorage.getItem('jr')||'null');if(s)store=Object.assign(store,s)}catch(e){}
const save=()=>{try{localStorage.setItem('jr',JSON.stringify(store))}catch(e){}programarSync()};
Object.keys(store.v).forEach(k=>{const m=k.match(/^(\d+)\|0\|(\d)\|([ne]\d\d)$/);if(m){const nk=`${m[1]}|x|${m[2]}|${m[3]}`;if(!(nk in store.v))store.v[nk]=store.v[k];delete store.v[k]}});
if(!store.mig2){Object.keys(store.f).forEach(k=>{if(!(k in store.ok))store.ok[k]=Date.now()});store.mig2=1}
try{const c=JSON.parse(localStorage.getItem('jr_ds')||'null');if(c&&c.length){DS=c;indexDS()}}catch(e){}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('jr',1);r.onupgradeneeded=()=>r.result.createObjectStore('vid');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const vget=async k=>{const d=await idb();return new Promise(ok=>{const q=d.transaction('vid').objectStore('vid').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)})};
const vput=async(k,b)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('vid','readwrite');t.objectStore('vid').put(b,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})};
const vdelete=async k=>{const d=await idb();return new Promise(ok=>{const t=d.transaction('vid','readwrite');t.objectStore('vid').delete(k);t.oncomplete=ok;t.onerror=ok})};

function guardarSesion(r){
  sess={at:r.access_token,rt:r.refresh_token,exp:r.expires_at||Math.floor(Date.now()/1000)+(r.expires_in||3600),uid:r.user.id,email:r.user.email};
  try{localStorage.setItem('jr_sess',JSON.stringify(sess))}catch(e){}

async function authPost(q,body){
  const r=await fetch(`${SB}/auth/v1/token?grant_type=${q}`,{method:'POST',headers:{apikey:KEY_PUB,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||('error '+r.status));
  return j;
}
async function token(){
  if(!sess)throw new Error('sin sesión');
  if(Date.now()/1000>sess.exp-60){
    try{guardarSesion(await authPost('refresh_token',{refresh_token:sess.rt}))}
    catch(e){cerrarSesion();throw e}
  }
  return sess.at;
}
async function api(path,opt){
  opt=opt||{};
  const t=await token();
  const r=await fetch(SB+path,Object.assign({},opt,{headers:Object.assign({apikey:KEY_PUB,Authorization:'Bearer '+t,'Content-Type':'application/json'},opt.headers||{})}));
  const tx=await r.text();
  if(!r.ok)throw new Error(r.status+' '+tx.slice(0,160));
  return tx?JSON.parse(tx):null;
}
async function traerTodo(path){
  let out=[],from=0;
  for(;;){
    const rows=await api(`${path}&limit=1000&offset=${from}`);
    out=out.concat(rows||[]);
    if(!rows||rows.length<1000)break;
    from+=1000;
  }
  return out;
}

const tipoDe=k=>(/^(f|ok)\|/.test(k)||/\|k\d\d$/.test(k))?'registro':'plan';
function estadoD(){
  const o={};
  for(const k in store.v){if(!k.startsWith('tb_'))o[k]=store.v[k]}
  for(const k in store.f)o['f|'+k]=store.f[k];
  for(const k in store.ok)o['ok|'+k]=store.ok[k];
  return o;
}
function estadoB(){
  const o={};
  for(const k in store.vid)o['vid|'+k]=store.vid[k];
  for(const k in store.alias)o['alias|'+k]=store.alias[k];
  store.lib.forEach(n=>{o['lib|'+n]=1});
  return o;
}
const difiere=(a,b)=>{const ka=Object.keys(a);if(ka.length!==Object.keys(b).length)return true;return ka.some(k=>JSON.stringify(a[k])!==JSON.stringify(b[k]))};
function programarSync(){
  if(!sess||!viendo||cargando)return;
  clearTimeout(syncT);syncT=setTimeout(sync,700);

async function sync(){
  syncT=null;
  if(!sess||!viendo)return;
  const id=viendo,d=estadoD(),b=estadoB(),now=new Date().toISOString();
  const upD=[],delD=[],upB=[],delB=[];
  for(const k in d)if(JSON.stringify(d[k])!==JSON.stringify(snapD[k]))upD.push({alumno_id:id,k:k,v:d[k],tipo:tipoDe(k),actualizado:now});
  for(const k in snapD)if(!(k in d))delD.push(k);
  if(esProfe()){
    for(const k in b)if(JSON.stringify(b[k])!==JSON.stringify(snapB[k]))upB.push({k:k,v:b[k],actualizado:now});
    for(const k in snapB)if(!(k in b))delB.push(k);
  }
  if(!upD.length&&!delD.length&&!upB.length&&!delB.length)return;
  try{
    for(let i=0;i<upD.length;i+=200)await api('/rest/v1/datos?on_conflict=alumno_id,k',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(upD.slice(i,i+200))});
    for(let i=0;i<delD.length;i+=40){
      const ks=delD.slice(i,i+40).map(x=>'"'+x+'"').join(',');
      await api(`/rest/v1/datos?alumno_id=eq.${id}&k=in.(${encodeURIComponent(ks)})`,{method:'DELETE',headers:{Prefer:'return=minimal'}});
    }
    for(let i=0;i<upB.length;i+=200)await api('/rest/v1/biblioteca?on_conflict=k',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(upB.slice(i,i+200))});
    for(const k of delB)await api('/rest/v1/biblioteca?k=eq.'+encodeURIComponent(k),{method:'DELETE',headers:{Prefer:'return=minimal'}});
    snapD=d;if(esProfe())snapB=b;
    aviso('Guardado ✓',1500);
  }catch(e){aviso('No se pudo guardar. Revisá la conexión.',4000)}
}
async function cargarDatos(id){
  const rows=await traerTodo(`/rest/v1/datos?alumno_id=eq.${id}&select=k,v&order=k`);
  const tb={};['tb_w','tb_r','tb_n'].forEach(k=>{if(k in store.v)tb[k]=store.v[k]});
  store.v=tb;store.f={};store.ok={};
  rows.forEach(r=>{
    if(r.k.startsWith('f|'))store.f[r.k.slice(2)]=r.v;
    else if(r.k.startsWith('ok|'))store.ok[r.k.slice(3)]=r.v;
    else store.v[r.k]=r.v;
  });
  snapD=estadoD();
  if(id!==viendo){MSG=[];PAGOS=[];anioPagos=new Date().getFullYear()}
  viendo=id;
}
async function cargarBiblioteca(){
  const rows=await traerTodo('/rest/v1/biblioteca?select=k,v&order=k');
  store.vid={};store.alias={};store.lib=[];
  rows.forEach(r=>{
    const i=r.k.indexOf('|'),t=r.k.slice(0,i),k=r.k.slice(i+1);
    if(t=='vid')store.vid[k]=r.v;else if(t=='alias')store.alias[k]=r.v;else if(t=='lib')store.lib.push(k);
  });
  snapB=estadoB();
  if(DS)indexDS();
  cargarBib();
}

let PAGOS=[],anioPagos=new Date().getFullYear();

function pintarPagos(){

  const t0=viendoCreado?new Date(viendoCreado):null,ini=t0?t0.getFullYear()*12+t0.getMonth():0;
  let h='';
  for(let m=1;m<=12;m++){
    const p=PAGOS.find(x=>x.mes===m),t=anioPagos*12+(m-1);
    const est=p?'pago':(t>=ini&&t<=cur?'pend':'fut');
    h+=`<button class="pg ${est}" data-pago="${m}"${esProfe()?'':' disabled'}><b>${MES_C[m-1]}</b><span>${p?'Pagado':(est=='pend'?'Pendiente':'—')}</span>${p&&p.monto!=null?`<small>${esc(pesos(p.monto))}</small>`:''}</button>`;
  }
  g.innerHTML=h;
  const r=document.getElementById('pagos-res');
  if(r){
    const p=PAGOS.find(x=>x.mes===hd.getMonth()+1);
    r.textContent=anioPagos===hd.getFullYear()?(MESES[hd.getMonth()]+': '+(p?'pagado ✓':'pendiente')):'';
  }

/* 4 ejercicios por circuito, mezclando grupos, cargados según semana y día */
function plan(w,d){
  const used=new Set();
  return [0,1,2].map(ci=>[0,1,2,3].map(p=>{
    const L=LIB[GRUPOS[(ci+p+d)%GRUPOS.length]];
    let i=(w*3+ci*2+p+d)%L.length,n=0;
    while(used.has(L[i])&&n<L.length){i=(i+1)%L.length;n++}
    used.add(L[i]);return L[i];
  }));
}

/* ---------- Temporizador Tabata ---------- */
const T={run:false,fase:'listo',left:0,ronda:0,cfg:null,iv:null};
let ac;
function beep(f,ms){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+ms/1000)}catch(e){}
  if(navigator.vibrate)navigator.vibrate(120);
}
function tStop(){T.run=false;clearInterval(T.iv)}
function tToggle(){
  if(T.run){tStop();updateTimer();return}
  if(T.fase=='listo'||T.fase=='fin'){
    T.cfg={w:Math.max(1,+val('tb_w',20)||20),r:Math.max(0,+val('tb_r',10)||0),n:Math.max(1,+val('tb_n',8)||8)};
    T.fase='trabajo';T.ronda=1;T.left=T.cfg.w;beep(988,250);
  }
  T.run=true;T.iv=setInterval(tick,1000);updateTimer();
}
function tReset(){tStop();T.fase='listo';updateTimer()}
function tick(){
  T.left--;
  if(T.left>0&&T.left<=3)beep(660,80);
  if(T.left<=0){
    if(T.fase=='trabajo'){
      if(T.ronda>=T.cfg.n){T.fase='fin';tStop();beep(523,700)}
      else if(T.cfg.r>0){T.fase='descanso';T.left=T.cfg.r;beep(523,250)}
      else{T.ronda++;T.left=T.cfg.w;beep(988,250)}
    }else{T.ronda++;T.fase='trabajo';T.left=T.cfg.w;beep(988,250)}
  }
  updateTimer();
}
function updateTimer(){
  const box=document.getElementById('tb-box');if(!box)return;
  const fase=T.fase,n=+val('tb_n',8)||8;
  box.className='tbvis '+(fase=='trabajo'||fase=='descanso'?fase:'');
  document.getElementById('tb-fase').textContent=fase=='trabajo'?'TRABAJO':fase=='descanso'?'DESCANSO':fase=='fin'?'¡Terminaste!':'Listo para empezar';
  const seg=fase=='listo'?(+val('tb_w',20)||20):fase=='fin'?0:T.left;
  document.getElementById('tb-t').textContent=Math.floor(seg/60)+':'+String(seg%60).padStart(2,'0');
  document.getElementById('tb-r').textContent=fase=='listo'?`${n} rondas`:`Ronda ${Math.min(T.ronda,T.cfg?T.cfg.n:n)} de ${T.cfg?T.cfg.n:n}`;
  document.getElementById('tb-go').textContent=T.run?'Pausar':(fase=='listo'||fase=='fin'?'Iniciar':'Continuar');
}

  else if(b.id=='pg-ok')guardarPago();
  else if(b.id=='pg-quitar')quitarPago();
  else if(D.olvide)pedirLink();
  else if(D.nueva)cambiarClave();
  else if(D.nuevo)abrirNuevo();
  else if(b.id=='na-x'||b.id=='na-fin')abrirAlus();
  else if(b.id=='na-ok')crearAlumno();
  else if(b.id=='na-copy')copiarMsg();
  else if(D.salir)cerrarSesion();
  else if(D.retry)iniciar();
  else if(D.alus)abrirAlus();
  else if(D.alu){const el=ALUS.find(x=>x.id===D.alu);document.getElementById('alus').close();elegirAlumno(D.alu,el)}
  else if(D.ren)renombrar();
  else if(b.id=='al-x')document.getElementById('alus').close();
  else if(D.t){st.tab=D.t;render();window.scrollTo(0,0)}
  else if(D.m!==undefined){st.mes=+D.m;render()}
  else if(D.w!==undefined){st.w=+D.w;st.d=+D.d;render()}
  else if(D.ok){const k=key('ok');if(k in store.ok)delete store.ok[k];else store.ok[k]=Date.now();save();render()}
  else if(D.tb=='toggle')tToggle();
  else if(D.tb=='reset')tReset();
  else if(D.ficha!==undefined)abrirFicha(D.ficha);
  else if(D.pickrow!==undefined){const dl=document.getElementById('dlg');if(dl.open)dl.close();abrirPick(D.pickrow)}
  else if(D.pid){const x=DSID.get(D.pid);if(x)ponerEjercicio(store.alias[x.id]||x.n,x.id)}
  else if(D.pown){const t=document.getElementById('pk-q').value.trim();if(t)ponerEjercicio(t,null)}
  else if(D.bajar)bajarDS();
  else if(D.more){P.shown+=30;fillPick()}
  else if(b.id=='pk-x')document.getElementById('pick').close();
  else if(b.id=='vclose')document.getElementById('dlg').close();
  else if(b.id=='vdel'){const d=document.getElementById('dlg'),vk=d.dataset.vk;vdelete(vk).then(()=>{delete store.own[vk];save();mostrarMiVideo(vk)})}
  else if(b.id=='vsave'){
    const d=document.getElementById('dlg'),vk=d.dataset.vk;
    let u=document.getElementById('vurl').value.trim();
    if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
    if(u)store.vid[vk]=u;else delete store.vid[vk];
    const al=document.getElementById('alias'),id=d.dataset.it;
    if(al&&id){
      const a=al.value.trim();
      if(a)store.alias[id]=a;else delete store.alias[id];
      const it=DSID.get(id);
      setX('n'+d.dataset.rid,a||it.n);setX('e'+d.dataset.rid,id);
      indexDS();cargarBib();
    }
    save();d.close();render();
  }
});

/* Al tocar un ejercicio se vacía para ver las sugerencias; si no se escribe nada, vuelve el anterior */
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.ex&&!t.readOnly){t.dataset.old=t.value;t.placeholder=t.value;t.value=''}});
document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.ex&&!t.value.trim())t.value=t.dataset.old||''});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id=='fat'){
    const f=+t.value;
    t.classList.toggle('vacio0',!f);
    document.getElementById('fat-txt').textContent=f?f+'/10 · '+FAT_TXT[f]:'Deslizá la barra para marcar';
  }else if(t.id=='pk-q'){P.shown=30;fillPick()}
  else if(t.id=='al-q')llenarAlus();
  else if(t.id=='chat-txt')chatDraft=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id=='pk-b'||t.id=='pk-e'){P.shown=30;fillPick();return}
  if(t.id=='vfile'){
    const f=t.files&&t.files[0],vk=document.getElementById('dlg').dataset.vk;
    if(f)vput(vk,f).then(()=>{store.own[vk]=1;save();mostrarMiVideo(vk)}).catch(()=>{document.getElementById('fv').innerHTML='<p>No se pudo guardar el video en este navegador.</p>'});
    return;
  }
  if(t.id=='fat'){
    const k=key('f'),f=+t.value;
    if(f)store.f[k]=f;else delete store.f[k];
    save();render();return;
  }
  if(t.dataset.g){store.v[t.dataset.g]=t.value;save();updateTimer();return}
  if(t.dataset.ex){
    const rid=t.dataset.row,n=t.value.trim();
    if(!n)return;
    setX('n'+rid,n);
    const lk=getX('e'+rid,'');
    if(lk){const it=DSID.get(lk);const disp=it?(store.alias[lk]||it.n):'';if(!it||disp.toLowerCase()!==n.toLowerCase())setX('e'+rid,'')}
    if(!todos().some(x=>x.toLowerCase()==n.toLowerCase())&&!buscarPorNombre(n)){store.lib.push(n);cargarBib()}
    save();return;
  }
  if(t.dataset.k){store.v[t.dataset.k]=t.value;save()}
});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lg-pass'||e.target.id==='nc-2')){const b=document.querySelector('[data-login],[data-nueva]');if(b)b.click()}});
window.addEventListener('online',programarSync);
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!sess||!viendo||cargando||syncT)return;
  if(difiere(estadoD(),snapD))return;
  try{const y=window.scrollY;await cargarDatos(viendo);render();window.scrollTo(0,y)}catch(e){}
});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
cargarBib();
render();
arrancar();
</script>
</body>
</html>
